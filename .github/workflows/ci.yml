name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for the browser host
        run: bunx playwright install chromium

      # `bun run build` dumps native+browser results, then statically exports the site.
      # Dump exit 0 means the diagnostic ran; pink/red cells are findings, not a CI gate.
      - name: Build
        run: bun run build
