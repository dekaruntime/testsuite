name: Native drift check

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'

jobs:
  native-drift:
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for the browser host
        run: bunx playwright install chromium

      # Same dump as site CI. Exit 0 means both Deka hosts ran; divergences are
      # recorded in hats-results.json, not treated as a workflow failure.
      - name: Dump native isolate and browser Worker results
        run: bun scripts/dump-results.mjs
